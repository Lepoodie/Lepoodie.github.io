<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Tesla Fleet token exchange</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:40rem;margin:2rem auto;padding:0 1rem}
  label{display:block;margin-top:1rem;font-weight:600}
  input,textarea{width:100%;box-sizing:border-box;padding:.5rem;margin-top:.25rem}
  button{margin-top:1.25rem;padding:.6rem 1rem;font-size:1rem}
  .hint{color:#555;font-size:.9rem}
</style>
</head>
<body>
<h1>Tesla Fleet — authorization code exchange</h1>
<p class="hint">Filled by Franklin; do not share. Form POSTs to Tesla fleet-auth (full navigation, no CORS).</p>
<form id="ex" method="POST" action="https://fleet-auth.prd.vn.cloud.tesla.com/oauth2/v3/token" enctype="application/x-www-form-urlencoded">
  <input type="hidden" name="grant_type" value="authorization_code"/>
  <input type="hidden" name="audience" value="https://fleet-api.prd.na.vn.cloud.tesla.com"/>
  <input type="hidden" name="redirect_uri" value="https://lepoodie.github.io/auth/callback"/>
  <label>client_id <input id="client_id" name="client_id" autocomplete="off" data-secure-name="tesla_client_id"/></label>
  <label>client_secret <input id="client_secret" name="client_secret" type="password" autocomplete="off" data-secure-name="tesla_client_secret"/></label>
  <label>code <input id="code" name="code" autocomplete="off"/></label>
  <button type="submit">Exchange</button>
</form>
<script>
  // Allow query ?code= to prefill
  const q = new URLSearchParams(location.search);
  if (q.get('code')) document.getElementById('code').value = q.get('code');
</script>
</body>
</html>
